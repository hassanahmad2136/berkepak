name: berkepak-saleor

services:
  api:
    image: ghcr.io/saleor/saleor:3.20
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - saleor-backend
    depends_on:
      - db
      - redis
      - mailpit
    volumes:
      - saleor-media:/app/media
    environment: &saleor-env
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      ALLOWED_CLIENT_HOSTS: "localhost,127.0.0.1,localhost:3000,localhost:9000"
      DATABASE_URL: postgres://saleor:saleor@db/saleor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_URL: smtp://mailpit:1025
      DEFAULT_FROM_EMAIL: "noreply@berkepak.local"
      DEFAULT_CHANNEL_SLUG: "default-channel"
      DASHBOARD_URL: "http://localhost:9000/"
      DEBUG: "True"
      ENABLE_DEBUG_TOOLBAR: "False"
      JAEGER_AGENT_HOST: ""
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: "True"
      HTTP_IP_FILTER_ENABLED: "False"
      # Dev secrets — REPLACE before any non-local deployment.
      SECRET_KEY: "dev-secret-key-change-me"
      RSA_PRIVATE_KEY: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIEowIBAAKCAQEAwxxx-replace-with-your-own-key-xxxx
        -----END RSA PRIVATE KEY-----

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.20
    ports:
      - "9000:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - saleor-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: saleor
      POSTGRES_DB: saleor
    ports:
      - "5433:5432"
    networks:
      - saleor-backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - saleor-redis:/data
    networks:
      - saleor-backend

  worker:
    image: ghcr.io/saleor/saleor:3.20
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend
    depends_on:
      - redis
      - mailpit
    volumes:
      - saleor-media:/app/media
    environment: *saleor-env

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - saleor-backend

volumes:
  saleor-db:
  saleor-redis:
  saleor-media:

networks:
  saleor-backend:
    driver: bridge
