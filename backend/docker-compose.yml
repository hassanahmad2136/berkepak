  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.20
    ports:
      - "9000:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - saleor-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: saleor
      POSTGRES_DB: saleor
    ports:
      - "5433:5432"
    networks:
      - saleor-backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - saleor-redis:/data
    networks:
      - saleor-backend

  worker:
    image: ghcr.io/saleor/saleor:3.20
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend
    depends_on:
      - redis
      - mailpit
    volumes:
      - saleor-media:/app/media
    environment: *saleor-env

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - saleor-backend

volumes:
  saleor-db:
  saleor-redis:
  saleor-media:

networks:
  saleor-backend:
    driver: bridge
